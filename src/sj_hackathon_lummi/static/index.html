<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lummi AIS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #controls { padding: 8px; background: #f4f4f4; }
    #map { height: calc(100vh - 50px); }
  </style>
</head>
<body>
    <div id="controls">
      <label class="check">
        <input id="live-toggle" type="checkbox" checked />
        Show live positions
      </label>
      Lat <input id="lat" type="number" step="any" value="48.7767" />
      Lon <input id="lon" type="number" step="any" value="-122.5942" />
      Radius (km) <input id="radius" type="number" step="any" value="0.5" />
      From <input id="start" type="datetime-local" />
      To <input id="end" type="datetime-local" />
      <button id="search">Search</button>
      <span id="status"></span>
    </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
